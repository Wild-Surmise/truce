[package]
name = "truce-egui"
version.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "egui-based GUI backend for truce audio plugins"

[dependencies]
truce-core = { workspace = true }
truce-gui = { workspace = true }
truce-params = { workspace = true }
egui = "0.34"
# default-features off so wgpu/default doesn't re-enable every backend;
# truce-gpu gates them per target_os.
egui-wgpu = { version = "0.34", default-features = false }
wgpu = { workspace = true }
pollster = "0.4"
raw-window-handle = "0.5"
keyboard-types = "0.7"
log = "0.4"
webbrowser = "1.2"

# baseview is desktop-only. iOS uses the in-tree editor_ios.rs which builds
# its wgpu surface from a CAMetalLayer attached to a UIView; wasm uses
# editor_web.rs, where the embedder owns the canvas and surface entirely.
[target.'cfg(all(not(target_os = "ios"), not(target_arch = "wasm32")))'.dependencies]
baseview = { workspace = true }

# `wgpu/metal` is gated on the Apple targets because
# `from_metal_layer` in `renderer.rs` references
# `SurfaceTargetUnsafe::CoreAnimationLayer`, which only exists when
# the Metal backend is compiled in. In workspace builds cargo
# unifies features through `truce-gpu` and this would be redundant,
# but `cargo publish --verify` compiles this crate in isolation —
# without an explicit declaration here, `truce-gpu`'s feature
# unification doesn't apply and the variant disappears. Same
# pattern as `truce-gpu/Cargo.toml`'s per-OS wgpu backend block.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
wgpu = { workspace = true, features = ["metal"] }

# `wgpu/webgpu` + `wgpu/webgl` are gated on wasm32 for the same
# feature-unification reason as the Apple `metal` block above:
# `egui-wgpu`'s wasm arm unconditionally references `wgpu::web_sys`,
# which only exists when wgpu's `web` cfg is active — itself gated on
# the `web` feature, which `webgpu` / `webgl` both imply. Both are
# enabled (not just one) because the eventual wasm host (`wsfx_web`,
# not yet built) opens the wgpu instance with
# `Backends::BROWSER_WEBGPU | Backends::GL` so WebGL2 still works
# where WebGPU is unavailable.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu", "webgl"] }

[lints]
workspace = true
